<title>اختبار الإدارة المكتبية الشامل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one narrow column. A navy hero opens the page, pages of the book are plain ruled rows, and the quiz is a single question card under a sticky progress bar. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --ink:#18223b; --muted:#566280; --line:#d8dde9;
  --head:#14264f; --amber:#9c6200; --amber-soft:#fcf1d8; --cta:#f2b33d; --on-cta:#1a2447;
  --ok:#1d7a4b; --ok-soft:#e2f4ea; --bad:#a3232a; --bad-soft:#fbe5e6; --on-mark:#ffffff;
  --primary:#14264f; --on-primary:#ffffff;
  --hero:#14264f; --on-hero:#f4f6fc; --hero-muted:#b9c3de;
  --fd:'Reem Kufi','IBM Plex Sans Arabic',Arial,Tahoma,sans-serif;
  --fb:'IBM Plex Sans Arabic',Arial,Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1322; --surface:#161f35; --ink:#e6eaf6; --muted:#9aa6c6; --line:#2a3652;
    --head:#b4c6ff; --amber:#f0b44a; --amber-soft:#33270e; --cta:#f0b44a; --on-cta:#1a2447;
    --ok:#5fd39a; --ok-soft:#10382a; --bad:#ff8f93; --bad-soft:#44181c; --on-mark:#0d1322;
    --primary:#3f66d9; --on-primary:#ffffff;
    --hero:#16203a; --on-hero:#eef1fb; --hero-muted:#a5b1d3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#161f35; --ink:#e6eaf6; --muted:#9aa6c6; --line:#2a3652;
  --head:#b4c6ff; --amber:#f0b44a; --amber-soft:#33270e; --cta:#f0b44a; --on-cta:#1a2447;
  --ok:#5fd39a; --ok-soft:#10382a; --bad:#ff8f93; --bad-soft:#44181c; --on-mark:#0d1322;
  --primary:#3f66d9; --on-primary:#ffffff;
  --hero:#16203a; --on-hero:#eef1fb; --hero-muted:#a5b1d3;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.7;padding-inline:16px;padding-block:0 2rem}
#root{max-width:720px;margin-inline:auto}
button,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.hero{background:var(--hero);color:var(--on-hero);border-radius:16px;padding:1.4rem 1.15rem 1.25rem;margin-block:1rem 1.8rem;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.045) 14px 15px);pointer-events:none}
.hero>*{position:relative}
.eyebrow{font-size:.82rem;letter-spacing:.04em;color:var(--cta);margin:0 0 .35rem;font-weight:600}
h1{font-family:var(--fd);font-size:2.25rem;line-height:1.25;margin:0 0 .55rem;font-weight:700;text-wrap:balance}
.lead{color:var(--hero-muted);margin:0 0 1.1rem;font-size:.97rem}
.seg{display:flex;gap:.45rem;margin-bottom:.8rem}
.seg label{flex:1 1 0;min-width:0;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:.5rem .3rem;border:1px solid rgba(255,255,255,.3);border-radius:10px;font-size:.92rem;line-height:1.5}
.seg input:checked+span{background:var(--on-hero);color:var(--hero);border-color:var(--on-hero);font-weight:600}
.seg input:focus-visible+span{outline:3px solid var(--cta);outline-offset:2px}
.rng{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;font-size:.93rem;flex-wrap:wrap}
.rng select{background:rgba(255,255,255,.12);color:var(--on-hero);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:.35rem .6rem;min-width:4.6rem}
.rng option{color:var(--ink);background:var(--surface)}
.shuf{display:flex;align-items:center;gap:.55rem;font-size:.93rem;margin-bottom:1rem;color:var(--on-hero)}
.shuf input{width:1.15rem;height:1.15rem;accent-color:var(--cta)}
.msg{color:var(--cta);font-size:.92rem;margin:0 0 .7rem;min-height:1.2rem}

.primary,.cta,.ghost,.small{border-radius:12px;font-weight:600;cursor:pointer;border:1.5px solid transparent;padding:.85rem 1.2rem;line-height:1.4}
.primary{background:var(--primary);color:var(--on-primary)}
.cta{background:var(--cta);color:var(--on-cta);width:100%;font-size:1.05rem}
.ghost{background:transparent;color:var(--head);border-color:var(--line)}
.ghost:hover{border-color:var(--head)}
.small{padding:.45rem .9rem;font-size:.9rem;background:transparent;color:var(--head);border-color:var(--line)}
.small:hover:not(:disabled){border-color:var(--head)}
.small:disabled{opacity:.4;cursor:default}

.secs h2{font-family:var(--fd);font-size:1.25rem;color:var(--head);margin:1.4rem 0 .3rem;font-weight:700}
.secs h2:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--line)}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:600;color:var(--head)}
.row .s{font-size:.85rem;color:var(--muted);line-height:1.5}
.row .best{font-size:.8rem;color:var(--ok);font-weight:600}
.foot{font-size:.85rem;color:var(--muted);margin-top:1.4rem;border-top:1px solid var(--line);padding-top:.9rem}

.qbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:.75rem .55rem;z-index:5}
.qtop{display:flex;align-items:center;gap:.6rem;font-size:.9rem}
.qtop .count{flex:1;text-align:center;font-weight:600;color:var(--head)}
.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:.2rem .1rem;font-size:.9rem}
.tally{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tally b{color:var(--ok)} .tally i{color:var(--bad);font-style:normal;font-weight:700}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:.55rem}
.track i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .25s}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1rem;margin-top:.4rem;margin-bottom:6.5rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.chip{font-size:.78rem;padding:.1rem .65rem;border-radius:99px;background:var(--amber-soft);color:var(--amber);font-weight:600}
.chip.n{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.q{font-size:1.14rem;line-height:1.8;margin:0 0 1rem;font-weight:500;text-wrap:pretty}
.opts{display:grid;gap:.6rem}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:.75rem;align-items:flex-start;text-align:start;width:100%;padding:.78rem .85rem;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;min-height:3rem;min-width:0}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .mk{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.9rem;font-weight:600;color:var(--muted)}
.opts.two .opt{justify-content:center;align-items:center;font-size:1.1rem;font-weight:600}
.opts.two .opt .tx{flex:none}
.opts.two .mk{display:none}
.opts.two .opt.ok .mk,.opts.two .opt.no .mk{display:grid}
.opt:hover:not(:disabled){border-color:var(--head)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--on-mark)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .mk{background:var(--bad);border-color:var(--bad);color:var(--on-mark)}
.opt.dim{opacity:.55}

.numrow{display:flex;gap:.6rem;align-items:stretch}
.numrow input{flex:1;min-width:0;font:inherit;font-size:1.2rem;text-align:center;direction:ltr;padding:.7rem;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.numrow input:disabled{opacity:.7}
.selfbtns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}

.fb{margin-top:1rem;border-radius:12px;padding:.8rem .95rem;font-size:.97rem;line-height:1.7}
.fb h3{margin:0 0 .15rem;font-size:1rem;font-weight:700}
.fb p{margin:.2rem 0 0;color:var(--ink)}
.fb.good{background:var(--ok-soft)} .fb.good h3{color:var(--ok)}
.fb.bad{background:var(--bad-soft)} .fb.bad h3{color:var(--bad)}
.fb.neutral{background:var(--amber-soft)} .fb.neutral h3{color:var(--amber)}
.warn{margin-top:.6rem;padding:.65rem .85rem;border-radius:10px;background:var(--surface);border:1px solid var(--amber);font-size:.92rem;line-height:1.7}
.warn b{color:var(--amber)}

.dock{position:fixed;inset-inline:0;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 40%);padding:1.4rem 16px calc(.8rem + env(safe-area-inset-bottom,0px));z-index:6}
.dock .primary{display:block;width:100%;max-width:720px;margin-inline:auto;font-size:1.05rem}

.score{display:flex;align-items:center;gap:1.1rem;margin-block:1.4rem}
.ring{--p:0;flex:none;width:7.6rem;height:7.6rem;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:5.9rem;height:5.9rem;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--fd);font-size:1.9rem;font-weight:700;color:var(--head)}
.score h2{font-family:var(--fd);font-size:1.7rem;margin:0;color:var(--head);line-height:1.3}
.score p{margin:.1rem 0 0;color:var(--muted);font-size:.95rem}
.bars{display:grid;gap:.75rem;margin-bottom:1.4rem}
.bar .top{display:flex;justify-content:space-between;gap:.6rem;font-size:.92rem;margin-bottom:.25rem}
.bar .top span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .tr{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ok);border-radius:99px}
.acts{display:grid;gap:.6rem;margin-bottom:1.4rem}
.rev h3{font-family:var(--fd);font-size:1.15rem;color:var(--head);margin:0 0 .3rem}
.ri{border-top:1px solid var(--line);padding:.85rem 0}
.ri .pgtag{display:inline-block;font-size:.78rem;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:99px;padding:.05rem .6rem;margin-bottom:.3rem}
.ri .rq{margin:0 0 .35rem;font-weight:500}
.ri .ra{margin:0;font-size:.93rem;color:var(--muted)}
.ri .ra b{color:var(--ok)} .ri .ra em{font-style:normal;color:var(--bad);font-weight:600}

@media (prefers-reduced-motion:reduce){.track i{transition:none}}
@media (max-width:380px){h1{font-size:1.9rem}.score{flex-direction:column;align-items:flex-start}}
</style>

<script>
(function(){
"use strict";
/* رقم الصفحة هو رقم صفحة ملف الـPDF (الغلاف ص١). الأسئلة مكتوبة بترتيب ظهورها في الملف. */
var Q=[];var PG=2;
function P(n){PG=n;}
function add(o){o.pg=PG;o.e=o.e||'';o.n=o.n||'';Q.push(o);}
/* من الملف */
function mc(q,o,a,e,n){add({orig:'file',t:'mc',q:q,o:o,a:a,e:e,n:n,sh:false});}
function tf(q,v,e,n){add({orig:'file',t:'tf',q:q,o:['صح','خطأ'],a:v?0:1,e:e,n:n,sh:false});}
function nu(q,a,e){add({orig:'file',t:'num',q:q,a:a,e:e});}
function sf(q,ans){add({orig:'file',t:'self',q:q,ans:ans});}
/* مضاف: مبني على ملخص المادة */
function mn(q,o,a,e){add({orig:'note',t:'mc',q:q,o:o,a:a,e:e,sh:true});}
function sn(q,ans){add({orig:'note',t:'self',q:q,ans:ans});}
/* مضاف: تدريب إضافي خارج الملف */
function nx(q,a,e){add({orig:'extra',t:'num',q:q,a:a,e:e});}

/* ===== ص٢: السكرتارية والاتصالات والتخطيط ===== */
P(2);
mn('السكرتارية العامة هي الوحدة التي:',['تقدم خدمات الأعمال المكتبية لكل إدارات المنظمة','تقدم خدماتها لإدارة معينة أو شخص معين','تقدم خدماتها لنشاط تخصصي معين','تقتصر على الأعمال الطبية'],0,'العامة تخدم كل الإدارات، والخاصة تخدم إدارة أو شخصاً معيناً، والمتخصصة تخدم نشاطاً تخصصياً كالطبي والتعليمي.');
mn('الاتصالات الرسمية تتم وفق:',['خطوط السلطة والقواعد والإجراءات الرسمية','القنوات غير الرسمية داخل المنظمة','العلاقات الشخصية بين الزملاء','رغبة المرسل وحده'],0);
mn('من اتجاهات الاتصالات الرسمية:',['هابط - صاعد - أفقي','أمامي - خلفي','داخلي - خارجي - دولي','دوري - طارئ - سري'],0);
mn('الترتيب الصحيح لكتابة العنوان على الرسالة:',['الدولة ← المدينة ← الشارع والحي ← رقم المبنى ← اسم المرسل إليه','اسم المرسل إليه ← رقم المبنى ← الشارع ← المدينة ← الدولة','المدينة ← الدولة ← الشارع ← اسم المرسل إليه','رقم المبنى ← الدولة ← المدينة ← الشارع'],0);
mn('أي مما يلي من أجزاء الرسالة الإدارية؟',['رقم الإحالة','الشعار الدعائي','الحاشية الجانبية','غلاف الرسالة'],0,'أجزاء الرسالة: الرأس، المرسل إليه، التاريخ، رقم الإحالة، تحية البداية، الموضوع، تحية الختام، التوقيع، المرفقات.');
mn('عدد أجزاء الرسالة الإدارية كما في الملخص:',['٩','٦','٧','١٢'],0);
mn('تستخدم نقطة النظام في الاجتماعات للتعبير عن:',['اعتراض العضو على أي مخالفة أو انحراف داخل الاجتماع','طلب رفع الجلسة للاستراحة','تأييد قرار المدير','تسجيل الحضور'],0);
sn('عرّف نقطة النظام في الاجتماعات.','تعبير عن اعتراض العضو على أي مخالفة أو انحراف خلال الاجتماع.');
mn('التقرير هو:',['عرض معلومات مكتوب أو شفوي حول موضوع ما بطريقة مبسطة','قرار نهائي يصدره المدير','جدول أعمال الاجتماع','رسالة شكر رسمية'],0);
mn('وضع الملفات فوق بعضها على أرفف أو طاولات مع زوائد صغيرة للتمييز يسمى:',['الطريقة الأفقية','الطريقة الرأسية','الحفظ الجغرافي','الحفظ الزمني'],0);
mn('وضع مستندات موضوع معين أو عميل معين في ملف واحد يحفظ في الأدراج يسمى:',['الطريقة الرأسية','الطريقة الأفقية','الحفظ الجغرافي','الحفظ الزمني'],0);
mn('التخطيط الاستراتيجي:',['طويل المدى ومن مهام الإدارة العليا','قصير المدى ومن مهام الإدارة الوسطى','قصير المدى ومن مهام الإدارة الدنيا','متوسط المدى ومن مهام العاملين'],0);
mn('التخطيط التكتيكي:',['قصير المدى ومن مهام الإدارة الوسطى','طويل المدى ومن مهام الإدارة العليا','قصير المدى ومن مهام الإدارة الدنيا','طويل المدى ومن مهام الإدارة الدنيا'],0);
mn('التخطيط التشغيلي من مهام:',['الإدارة الدنيا (التنفيذية)','الإدارة العليا','الإدارة الوسطى','مجلس الإدارة'],0,'وهو قصير المدى.');
mn('الشكل البياني الذي يوضح ارتباط الإدارات بعضها ببعض وفق خطوط السلطة:',['الخريطة التنظيمية','جدول الأعمال','السيرة الذاتية','الوصف الوظيفي'],0);
mn('التنظيم هو الوظيفة ........ من وظائف الإدارة:',['الثانية','الأولى','الثالثة','الأخيرة'],0,'يحدد الوظائف والأنشطة والعلاقة بينها والسلطات والمسؤوليات.');

/* ===== ص٣: مشاكل التخطيط والمركزية والقيادة والجودة ===== */
P(3);
mn('من المشاكل التي تعترض التخطيط:',['أن تكون المعلومات التي قامت عليها الخطة خاطئة أو غير دقيقة','وضوح الأهداف','سهولة الحصول على المعلومات الدقيقة','دقة تحديد البدائل'],0,'ومنها أيضاً صعوبة الحصول على المعلومات الدقيقة والوضع الحالي للمنشأة.');
mn('الترتيب الصحيح لمراحل إعداد الخطة:',['الوضع الحالي ← الأهداف ← الفروض التخطيطية ← البدائل ← تقييم البدائل ← اختيار الأفضل','الأهداف ← الوضع الحالي ← البدائل ← الفروض ← اختيار الأفضل ← تقييم البدائل','البدائل ← الأهداف ← الفروض ← الوضع الحالي ← التقييم ← الاختيار','الفروض ← الوضع الحالي ← الأهداف ← اختيار الأفضل ← البدائل ← التقييم'],0);
sn('اذكر مراحل إعداد الخطة بالترتيب.','١) التعرف على الوضع الحالي للمنشأة ٢) تحديد الأهداف ٣) وضع الفروض التخطيطية ٤) تحديد البدائل ٥) تقييم البدائل ٦) اختيار البديل الأفضل.');
mn('درجة تركيز السلطة في شخص الإدارة العليا تسمى:',['المركزية','اللامركزية','التفويض','نطاق الإشراف'],0,'وتتميز المركزية بتخصيص ازدواج الوظائف.');
mn('توزيع السلطة بين المستويات الإدارية المختلفة (تفويض سلطة اتخاذ القرارات للمستويات الأقل) يسمى:',['اللامركزية','المركزية','وحدة الأمر','نطاق الإشراف'],0);
sn('ما الفرق بين المركزية واللامركزية؟','المركزية: درجة تركيز السلطة في الهيكل التنظيمي، أي في شخص الإدارة العليا. اللامركزية: توزيع السلطة بين المستويات الإدارية المختلفة، أي تفويض سلطة اتخاذ القرارات للمستويات الأقل.');
mn('القيادة المعتمدة على السلطة الكاملة والإجبار:',['القيادة الديكتاتورية','القيادة الأوتوقراطية','القيادة الديمقراطية','القيادة الأبوية'],0);

function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function getBest(k){try{var v=localStorage.getItem('oaq2-'+k);return v===null?null:+v;}catch(e){return null;}}
function setBest(k,p){try{var o=getBest(k);if(o===null||p>o)localStorage.setItem('oaq2-'+k,String(p));}catch(e){}}
function pick(from,to){return Q.filter(function(q){return q.pg>=from&&q.pg<=to;});}

}

function readOpts(){
  var s=document.getElementById('shuf'); if(s)opts.shuffle=s.checked;
  var a=document.getElementById('pf'),b=document.getElementById('pt');
  if(a&&b){var x=+a.value,y=+b.value;if(x>y){var t=x;x=y;y=t;}opts.from=x;opts.to=y;}
}

function begin(list,key){
  var items=list.map(function(q){
    var ord=null;
    if(q.o){ord=q.o.map(function(_,i){return i;});if(q.sh)ord=shuffle(ord);}
    return {q:q,ord:ord};
  });
  if(opts.shuffle)items=shuffle(items);
  run={items:items,i:0,res:[],key:key||null,done:false};
  window.scrollTo(0,0);
  showQ();
}

/* ===== شاشة السؤال ===== */
function showQ(){
  var it=run.items[run.i];
  if(!it){finish();return;}
  var q=it.q,n=run.items.length,i=run.i;
  var okc=run.res.filter(function(r){return r.ok;}).length;
  var bad=run.res.length-okc;
  var body='';
  if(q.t==='mc'||q.t==='tf'){
    body='<div class="opts'+(q.t==='tf'?' two':'')+'">'+it.ord.map(function(oi,k){
      return '<button class="opt" data-oi="'+oi+'"><span class="mk">'+(q.t==='tf'?'':letters[k])+'</span><span class="tx">'+q.o[oi]+'</span></button>';
    }).join('')+'</div>';
  }else if(q.t==='num'){
    body='<div class="numrow"><input id="num" inputmode="decimal" autocomplete="off" aria-label="اكتب الإجابة"><button class="primary" data-act="check">تحقق</button></div>';
  }else{
    body='<button class="primary" data-act="reveal">أظهر الإجابة</button>';
  }
  var last=(i===n-1);
  root.innerHTML=
   '<div class="qbar"><div class="qtop"><button class="link" data-act="quit">إنهاء</button>'+
   '<span class="count">سؤال '+ar(i+1)+' من '+ar(n)+'</span>'+
   '<span class="tally"><b>'+ar(okc)+' ✓</b> · <i>'+ar(bad)+' ✕</i></span></div>'+
   '<div class="track"><i style="width:'+Math.round(i/n*100)+'%"></i></div></div>'+
   '<article class="qcard"><div class="chips"><span class="chip">صفحة '+ar(q.pg)+'</span><span class="chip n">'+ORIG[q.orig]+'</span><span class="chip n">'+TYPE[q.t]+'</span></div>'+
   '<p class="q">'+q.q+'</p>'+body+'<div id="fb" aria-live="polite"></div></article>'+
   '<div class="dock" id="dock" hidden><button class="primary" data-act="next">'+(last?'عرض النتيجة':'السؤال التالي')+'</button></div>';
  run.done=false;
  var inp=document.getElementById('num');
  if(inp){inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check();}});}
}

function fbHtml(q,ok){
  var h='<div class="fb '+(ok?'good':'bad')+'" role="status"><h3>'+(ok?'إجابة صحيحة':'إجابة غير صحيحة')+'</h3>';
  if(!ok){
    var c=q.t==='num'?ar(q.a):q.o[q.a];
    h+='<p>الصحيح: <b>'+c+'</b></p>';
  }
  if(q.e)h+='<p>'+q.e+'</p>';
  h+='</div>';
  if(q.n)h+='<div class="warn"><b>تنبيه من الملف:</b> '+q.n+'</div>';
  return h;
}

function tallyUpdate(){
  var okc=run.res.filter(function(r){return r.ok;}).length;
  root.querySelector('.tally').innerHTML='<b>'+ar(okc)+' ✓</b> · <i>'+ar(run.res.length-okc)+' ✕</i>';
}

function settle(ok,pk){
  var it=run.items[run.i];
  run.res.push({q:it.q,ok:ok,pick:pk});
  run.done=true;
  document.getElementById('fb').innerHTML=fbHtml(it.q,ok);
  document.getElementById('dock').hidden=false;
  tallyUpdate();
  var f=document.getElementById('fb');
  if(f.scrollIntoView)f.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function pickOpt(oi){
  if(run.done)return;
  var q=run.items[run.i].q;
  var ok=(oi===q.a);
  var bs=root.querySelectorAll('.opt');
  for(var k=0;k<bs.length;k++){
    var b=bs[k],o=+b.dataset.oi;
    b.disabled=true;
    if(o===q.a){b.classList.add('ok');b.querySelector('.mk').textContent='✓';}
    else if(o===oi){b.classList.add('no');b.querySelector('.mk').textContent='✕';}
    else b.classList.add('dim');
  }
  settle(ok,oi);
}

function check(){
  if(run.done)return;
  var inp=document.getElementById('num');
  var raw=inp.value.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace('٫','.').replace(',','.').trim();
  if(raw===''||isNaN(+raw)){inp.focus();return;}
  var q=run.items[run.i].q;
  var ok=Math.abs(+raw-q.a)<0.01;
  inp.disabled=true;
  root.querySelector('[data-act="check"]').disabled=true;
  settle(ok,raw);
}

function reveal(btn){
  var q=run.items[run.i].q;
  btn.hidden=true;
  document.getElementById('fb').innerHTML=
   '<div class="fb neutral"><h3>الإجابة النموذجية</h3><p>'+q.ans+'</p></div>'+
   '<div class="selfbtns" id="selfbtns"><button class="primary" data-act="know">عرفتها</button><button class="ghost" data-act="dont">لم أعرفها</button></div>';
}

function grade(ok){
  if(run.done)return;
  var it=run.items[run.i];
  run.res.push({q:it.q,ok:ok,pick:null});
  run.done=true;
  document.getElementById('selfbtns').hidden=true;
  document.getElementById('dock').hidden=false;
  tallyUpdate();
}

function next(){
  run.i++;
  window.scrollTo(0,0);
  showQ();
}

function endEarly(){
  if(!run.res.length){home();return;}
  run.items=run.items.slice(0,run.res.length);
  finish();
}

/* ===== النتيجة ===== */
function finish(){
  var total=run.res.length;
  var okc=run.res.filter(function(r){return r.ok;}).length;
  var pct=total?Math.round(okc/total*100):0;
  if(run.key&&total===run.items.length)setBest(run.key,pct);
  var tier=pct>=90?'ممتاز':pct>=75?'جيد جداً':pct>=60?'جيد':'يحتاج إلى مراجعة';
  var g={a:{t:'ملخص المادة (ص٢–٨)',ok:0,n:0},b:{t:'أسئلة الملف (ص٩–٢٣)',ok:0,n:0}};
  run.res.forEach(function(r){var k=r.q.pg<=8?'a':'b';g[k].n++;if(r.ok)g[k].ok++;});
  var bars=['a','b'].filter(function(k){return g[k].n;}).map(function(k){
    var b=g[k],p=Math.round(b.ok/b.n*100);
    return '<div class="bar"><div class="top"><span>'+b.t+'</span><span>'+ar(b.ok)+' / '+ar(b.n)+'</span></div><div class="tr"><i style="width:'+p+'%"></i></div></div>';
  }).join('');
  var wrong=run.res.filter(function(r){return !r.ok;});
  root.innerHTML=
   '<div class="score"><div class="ring" style="--p:'+pct+'"><span>'+ar(pct)+'٪</span></div>'+
   '<div><h2>'+tier+'</h2><p>أجبت صحيحاً عن '+ar(okc)+' من '+ar(total)+' سؤالاً.</p></div></div>'+
   '<div class="bars">'+bars+'</div>'+
   '<div class="acts">'+
   (wrong.length?'<button class="primary" data-act="wrong">أعد الأسئلة الخاطئة فقط ('+ar(wrong.length)+')</button><button class="ghost" data-act="review">راجع الأخطاء مع أرقام الصفحات</button>':'')+
   '<button class="ghost" data-act="home">القائمة الرئيسية</button></div>'+
   '<div class="rev" id="rev"></div>';
  window.scrollTo(0,0);
}

function review(){
  var wrong=run.res.filter(function(r){return !r.ok;}).slice().sort(function(a,b){return a.q.pg-b.q.pg;});
  var h='<h3>الأسئلة الخاطئة حسب الصفحات</h3>'+wrong.map(function(r){
    var q=r.q,c,mine='';
    if(q.t==='num'){c=ar(q.a);mine=r.pick?ar(r.pick):'';}
    else if(q.t==='self'){c=q.ans;}
    else{c=q.o[q.a];if(r.pick!==null&&r.pick!==undefined)mine=q.o[r.pick];}
    return '<div class="ri"><span class="pgtag">صفحة '+ar(q.pg)+'</span><p class="rq">'+q.q+'</p>'+
      (mine?'<p class="ra">إجابتك: <em>'+mine+'</em></p>':'')+
      '<p class="ra">الصحيح: <b>'+c+'</b></p>'+
      (q.e?'<p class="ra">'+q.e+'</p>':'')+
      (q.n?'<div class="warn"><b>تنبيه من الملف:</b> '+q.n+'</div>':'')+'</div>';
  }).join('');
  var el=document.getElementById('rev');
  el.innerHTML=h;
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ===== الأحداث ===== */
root.addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b||b.disabled)return;
  if(b.classList.contains('opt')){pickOpt(+b.dataset.oi);return;}
  var a=b.dataset.act;
  if(a==='all'){
    readOpts();
    var list=pick(opts.from,opts.to);
    if(!list.length){document.getElementById('msg').textContent='لا توجد أسئلة من الملف في هذا النطاق، وسّع النطاق أو اختر كل الأسئلة.';return;}
    var full=(opts.from===2&&opts.to===23);
    begin(list,full?'all':null);
  }else if(a==='page'){
    readOpts();
    var pg=+b.dataset.pg;
    begin(pick(pg,pg),'p'+pg);
  }else if(a==='next'){next();}
  else if(a==='check'){check();}
  else if(a==='reveal'){reveal(b);}
  else if(a==='know'){grade(true);}
  else if(a==='dont'){grade(false);}
  else if(a==='review'){review();}
  else if(a==='wrong'){
    var wl=run.res.filter(function(r){return !r.ok;}).map(function(r){return r.q;});
    begin(wl,null);
  }else if(a==='home'){home();window.scrollTo(0,0);}
  else if(a==='quit'){
    if(!b.dataset.arm){
      b.dataset.arm='1';b.textContent='تأكيد الإنهاء';
      setTimeout(function(){if(b.isConnected){delete b.dataset.arm;b.textContent='إنهاء';}},3000);
    }else{endEarly();}
  }
});

home();
})();
</script>

</body></html>
