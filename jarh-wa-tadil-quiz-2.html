<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار الجرح والتعديل</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef4fb;--surface:#ffffff;--ink:#16202c;--muted:#5a6b7d;--line:#d3deea;--chip:#e3ecf6;
  --ok:#15803d;--ok-bg:#dcfce7;--no:#dc2626;--no-bg:#fee2e2;--focus:#2563eb;--track:#d3deea;
  --c0:#2563eb;--c1:#9333ea;--c2:#ea580c;--c3:#059669;--c4:#db2777;--c5:#ca8a04;--qc:#6d28d9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220;--surface:#141d2e;--ink:#e8eef7;--muted:#94a3b8;--line:#2a3850;--chip:#1c2840;
    --ok:#4ade80;--ok-bg:#0f3320;--no:#f87171;--no-bg:#3b1414;--focus:#60a5fa;--track:#2a3850;
    --c0:#60a5fa;--c1:#c084fc;--c2:#fb923c;--c3:#34d399;--c4:#f472b6;--c5:#facc15;--qc:#c4b5fd;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220;--surface:#141d2e;--ink:#e8eef7;--muted:#94a3b8;--line:#2a3850;--chip:#1c2840;
    --ok:#4ade80;--ok-bg:#0f3320;--no:#f87171;--no-bg:#3b1414;--focus:#60a5fa;--track:#2a3850;
    --c0:#60a5fa;--c1:#c084fc;--c2:#fb923c;--c3:#34d399;--c4:#f472b6;--c5:#facc15;--qc:#c4b5fd;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:20px;line-height:1.8;
  padding:0 max(14px,env(safe-area-inset-left,0px)) 56px max(14px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin-inline:auto;min-width:0}
h1{font-size:26px;line-height:1.4;margin:22px 0 2px;color:var(--c0);text-wrap:balance}
.lead{margin:0 0 14px;color:var(--muted);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.act{border:2px solid var(--c0);background:var(--c0);color:var(--surface);border-radius:12px;padding:9px 18px;font-weight:700;font-size:16px;min-height:44px}
.act.alt{background:transparent;color:var(--c0)}
.act[hidden]{display:none}
.toprow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.total{color:var(--muted);font-size:15px}
.grid{display:grid;gap:10px;margin-top:10px}
.tile{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);
  border-inline-start:8px solid var(--c);border-radius:14px;padding:12px 14px;min-width:0}
.tile b{display:flex;justify-content:space-between;gap:10px;font-size:21px;color:var(--c)}
.tile small{display:block;color:var(--muted);font-size:14px;line-height:1.5;margin-top:2px}
.mini{height:6px;border-radius:9px;background:var(--track);margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);width:0;transition:width .25s}
.c0{--c:var(--c0)}.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:2px solid var(--c)}
.bar-row{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:15px;min-height:40px;white-space:nowrap}
.sec-title{font-weight:700;color:var(--c);font-size:21px;flex:1;min-width:0}
.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.s-ok{color:var(--ok)}.s-no{color:var(--no)}.s-left{color:var(--muted)}
.track{height:7px;border-radius:9px;background:var(--track);margin-top:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%;transition:width .25s}
.t-ok{background:var(--ok)}.t-no{background:var(--no)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-block:12px;min-width:0}
.q[hidden]{display:none}
.q-num{font-size:16px;color:var(--c);font-weight:700;margin-bottom:2px}
.q-text{margin:0 0 12px;font-size:23px;line-height:1.7;font-weight:700;color:var(--qc)}
.opts{display:grid;gap:8px}
.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;min-width:0;text-align:right;background:var(--surface);
  border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:21px;line-height:1.6;min-height:52px}
.letter{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--chip);color:var(--muted);display:grid;place-items:center;font-size:16px;font-weight:700}
.txt{min-width:0;overflow-wrap:anywhere}
.tf .opt{justify-content:center;align-items:center;font-weight:700}
.locked .opt{pointer-events:none}
.locked .opt:not(.ok):not(.no){opacity:.55}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.no{background:var(--no-bg);border-color:var(--no);color:var(--no);font-weight:700}
.opt.ok .letter{background:var(--ok);color:var(--ok-bg)}
.opt.no .letter{background:var(--no);color:var(--no-bg)}
.why{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:19px;line-height:1.85}
.verdict{display:block;font-weight:700;margin-bottom:2px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.e{color:var(--c);font-weight:700}
.result{background:var(--surface);border:2px solid var(--c);border-radius:16px;padding:16px;margin-top:18px}
.result h3{margin:0 0 4px;font-size:21px;color:var(--c)}
.result p{margin:4px 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.result .act{background:var(--c);border-color:var(--c)}
.result .act.alt{background:transparent;color:var(--c)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) max(14px,env(safe-area-inset-right,0px))}
.sheet[hidden]{display:none}
.sheet-in{max-width:720px;margin-inline:auto}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;z-index:2}
.sheet-head h2{margin:0;font-size:22px;color:var(--c0)}
.sg{background:var(--surface);border:1px solid var(--line);border-inline-start:8px solid var(--c);border-radius:14px;padding:10px 14px;margin-block:12px}
.sg h3{margin:0 0 6px;font-size:22px;color:var(--c)}
.sq{padding:8px 0;border-top:1px dashed var(--line)}
.sq:first-of-type{border-top:0}
.sqq{font-size:22px;font-weight:700;color:var(--qc);line-height:1.7}
.sqa{font-size:22px;font-weight:700;color:var(--ok);line-height:1.7}
.sqp{display:inline-block;background:var(--chip);color:var(--muted);border-radius:8px;padding:0 8px;font-size:17px;font-weight:700;margin-inline-end:6px}
.sqw{font-size:19px;color:var(--muted);line-height:1.7;margin-top:2px}
@media (prefers-reduced-motion: reduce){.mini i,.track i{transition:none}}
@media (max-width:380px){body{font-size:18px}.q-text{font-size:21px}.opt,.sqq,.sqa{font-size:19px}}
</style>
</head>
<body>
<main class="wrap">
  <div id="home">
    <h1>اختبار الجرح والتعديل</h1>
    <p class="lead">اختر قسماً، أجب عن أسئلته، وفي نهايته أعد الأسئلة التي أخطأت فيها حتى تتقنها.</p>
    <div class="toprow">
      <button class="act" id="sumBtn" type="button">ملخص أهم الأسئلة</button>
      <button class="act" id="sumAllBtn" type="button">ملخص جميع الأسئلة</button>
      <span class="total" id="total"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="secView" hidden>
    <div class="bar" id="bar">
      <div class="bar-row">
        <button class="back" id="back" type="button">‹ الأقسام</button>
        <div class="sec-title" id="secTitle"></div>
      </div>
      <div class="stats" role="status" aria-live="polite">
        <span class="s-ok">صحيح <b id="cOk">٠</b></span>
        <span class="s-no">خطأ <b id="cNo">٠</b></span>
        <span class="s-left">المتبقي <b id="cLeft">٠</b></span>
      </div>
      <div class="track" aria-hidden="true"><i class="t-ok" id="tOk" style="width:0"></i><i class="t-no" id="tNo" style="width:0"></i></div>
    </div>
    <div id="cards"></div>
    <div class="result" id="result" hidden>
      <h3 id="rTitle"></h3>
      <p id="rText"></p>
      <div class="btns">
        <button class="act" id="retryWrong" type="button">أعد الأسئلة التي أخطأت فيها</button>
        <button class="act" id="nextSec" type="button">القسم التالي ›</button>
        <button class="act alt" id="restart" type="button">ابدأ القسم من جديد</button>
      </div>
    </div>
  </div>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-label="ملخص جميع الأسئلة">
  <div class="sheet-in">
    <div class="sheet-head"><h2 id="sumTitle">ملخص أهم الأسئلة</h2><button class="act alt" id="closeSum" type="button">إغلاق</button></div>
    <div id="sumBody"></div>
  </div>
</div>

<script>
(function(){
  var D = [{"t": "تعريف الجرح والتعديل", "items": [{"q": "الجُرح بالضم في اللغة:", "o": ["التسوية والموازنة", "اسم الأثر الحاصل بالجرح", "التأثير بالسلاح"], "a": 1, "w": "الجَرح بالفتح التأثير بالسلاح، والجُرح بالضم *اسم الأثر*. وقيل: الجُرح في الأبدان والجَرح باللسان في الأعراض.", "p": 24}, {"q": "الجرح اصطلاحًا: وصف الراوي في عدالته أو ضبطه بما يقتضي:", "o": ["حفظه للكتاب", "قبول روايته", "تليين روايته أو تضعيفها أو ردها"], "a": 2, "w": "هذا *الجرح*، والتعديل ضده: وصفه بما يقتضي قبول روايته.", "p": 24}, {"q": "أي أنواع التضعيف يقع عند المفاضلة بين راويين فأكثر؟", "o": ["المقيَّد", "النسبي", "المطلق"], "a": 1, "w": "*النسبي*: لا يلزم منه الضعف المطلق. والمقيَّد خاص ببعض الشيوخ أو البلدان أو الأوقات.", "p": 25}, {"q": "الموصوف بالرد (الضعيف جدًا) يقوّي غيره ويتقوى بغيره.", "o": ["صح", "خطأ"], "a": 1, "w": "*خطأ*: لا يقوّي ولا يتقوى، بخلاف الضعف المطلق الذي يتقوى بالمتابعة فيرتقي إلى حسن لغيره.", "tf": 1, "p": 25}, {"q": "استُعمل «التعديل» اصطلاحًا بمعنى:", "o": ["الضبط فقط", "العدالة فقط", "التوثيق: العدالة والضبط"], "a": 2, "w": "فيشمل من يُقبل في مرتبة *الصحيح لذاته والحسن لذاته*.", "p": 25}, {"q": "الصدوق سيئ الحفظ توصف روايته بأنها:", "o": ["تُرد مطلقًا", "تتقوى بقرينة ترجّح جانب ضبطه", "تُقبل دائمًا"], "a": 1, "w": "وهو الموصوف بما يقتضي *تليين* روايته.", "p": 24}, {"q": "التعديل لغة: التسوية وتقويم الشيء وموازنته بغيره.", "o": ["صح", "خطأ"], "a": 0, "w": "*صح*: وهذا معناه في اللغة، أما اصطلاحًا فهو التوثيق.", "tf": 1, "p": 25}, {"q": "القبول في تعريف التعديل يشمل:", "o": ["الصحيح لذاته والحسن لذاته", "الصحيح والضعيف", "الصحيح لذاته فقط"], "a": 0, "w": "لأن هؤلاء *يُحتج بمروياتهم* وإن تفاوتت مراتبها.", "p": 25}, {"q": "التضعيف المطلق تتقوى رواية صاحبه بالمتابعة فتصير:", "o": ["حسنًا لغيره", "موضوعة", "صحيحًا لذاته"], "a": 0, "w": "ولا يُقبل عند *التفرد*.", "p": 25}, {"q": "في أصل اللغة الجرح والجَرح بمعنى واحد، لكن المتداول بينهم التفريق.", "o": ["صح", "خطأ"], "a": 0, "w": "*صح*: قاله الزبيدي.", "tf": 1, "p": 24}, {"q": "قال ابن الأثير: الجرح وصف متى التحق بالراوي:", "o": ["ثبتت عدالته", "قُبل مرسله", "سقط الاعتبار بقوله وبطل العمل به"], "a": 2, "w": "وهذا في الراوي والشاهد.", "p": 24}]}, {"t": "العدالة والعدل والضبط", "items": [{"q": "العدالة هي:", "o": ["اشتهار الراوي", "كثرة المحفوظ", "مَلَكة تحمل على ملازمة التقوى والمروءة"], "a": 2, "w": "التقوى: اجتناب الشرك والفسق والبدعة. والمروءة مرجعها *العُرف*.", "p": 25}, {"q": "الإسلام والبلوغ شرطان:", "o": ["للأداء لا للتحمل", "للتحمل لا للأداء", "للتحمل والأداء معًا"], "a": 0, "w": "فقد تحمّل بعض الصحابة قبل إسلامهم وصغارهم حال صباهم، وأدّوا بعد الإسلام والبلوغ.", "p": 25}, {"q": "الضبط نوعان:", "o": ["ضبط ظاهر وضبط باطن", "ضبط لفظ وضبط معنى", "ضبط صدر وضبط كتاب"], "a": 2, "w": "*ضبط الصدر*: أن يحفظ ما سمعه ويثبّته بحيث يستحضره متى شاء. و*ضبط الكتاب*: صيانته لديه منذ سمع فيه وصحّحه إلى أن يؤدي منه. (أما الظاهر والباطن فتقسيم ابن الأثير).", "p": 27}, {"q": "ضبط الصدر هو:", "o": ["أن يحفظ ما سمعه ويستحضره متى شاء", "كثرة السماع", "صيانة الكتاب منذ السماع"], "a": 0, "w": "أما ضبط *الكتاب* فصيانته منذ سمع فيه وصحّح إلى أن يؤدي منه.", "p": 27}, {"q": "السلامة من الفسق وخوارم المروءة تُعتبر بـ:", "o": ["الباطن", "ظاهر حال الراوي", "الشهرة"], "a": 1, "w": "ويقلّ تضعيف الراوي بخرم المروءة، كقول شعبة: *رأيته يركض على برذون*.", "p": 27}, {"q": "المروءة مرجعها:", "o": ["العُرف فتختلف باختلاف الأشخاص والبلدان", "النص", "العقل"], "a": 0, "w": "كالأكل في الأسواق والمزاح، قد يُعد خرمًا عند قوم دون آخرين.", "p": 114}, {"q": "العدل هو:", "o": ["المسلم البالغ العاقل السالم من أسباب الفسق وخوارم المروءة", "الحافظ", "البالغ فقط"], "a": 0, "w": "وسبب الفسق: *كبيرة أو إصرار على صغيرة*.", "p": 25}, {"q": "ابن الأثير يقسم الضبط إلى:", "o": ["ظاهر وباطن", "تام وناقص", "صدر وكتاب"], "a": 0, "w": "الظاهر: ضبط المعنى لغة، والباطن: من حيث الحكم (الفقه)، والمشترَط عند الأكثر *الظاهر*.", "p": 27}, {"q": "كل ما يلي يخرج بتعريف العدل إلا:", "o": ["الصبي", "الصدوق سيئ الحفظ", "الكافر"], "a": 1, "w": "سيئ الحفظ يخرج *بالضبط* لا بالعدل.", "p": 27}, {"q": "الصبي المميِّز: تحمّله صحيح وأداؤه يُعتبر:", "o": ["بع  في مجلس السماع:", "o": ["لا يضر إذا لم يختل معه الفهم", "يُسقط الرواية", "شرط في الضبط"], "a": 0, "w": "ومن عُرف بعدم المبالاة بالنوم *لم تُقبل روايته*؛ وكان المزّي ربما ينعس فيرد على القارئ.", "p": 131}, {"q": "يُعرف حصول الوهم بـ:", "o": ["جمع الطرق والمقارنة بينها", "كثرة الحفظ", "شهرة الراوي"], "a": 0, "w": "وما ظهر الوهم فيه فهو *المعلَّل*.", "p": 137}, {"q": "الصدوق سيئ الحفظ يزول ضعفه إذا كان:", "o": ["كثير الشيوخ", "مشهورًا", "أثبت من يروي عن شيخ معين لطول ملازمته"], "a": 2, "w": "ويزداد ضعفه بالسماع من شيخه بعد اختلاطه.", "p": 133}, {"q": "لسهيل بن أبي صالح في البخاري:", "o": ["أحاديث كثيرة", "لا شيء", "حديث مقرون وحديثان متابعة"], "a": 2, "w": "من انتقاء الشيخين لرواية المختلطين.", "p": 134}, {"q": "من كتب المختلطين:", "o": ["الكامل", "الاغتباط بمعرفة من رُمي بالاختلاط", "الثقات"], "a": 1, "w": "ومنها «الكواكب النيّرات» لابن الكيّال.", "p": 135}, {"q": "التلقين:", "o": ["اختبار الحفظ", "أن يُوضع للغافل حديث فيحدّث به على أنه من مسموعاته", "الإملاء"], "a": 1, "w": "ينشأ عن *شدة الغفلة*.", "p": 137}, {"q": "فحش الغلط يجعل الراوي:", "o": ["يُحتج به", "لا يقوّي غيره ولا يتقوى بغيره وما تفرد به منكر", "ثقة"], "a": 1, "w": "إذ يخرج عن الاعتبار في المتابعة.", "p": 138}, {"q": "الإسماعيلي والبرقاني في الرواية من فرع لم يُعارَض بالأصل:", "o": ["يمنعانها", "يجيزانها بلا شرط", "بشرط بيان ذلك عند الأداء"], "a": 2, "w": "كقوله: ولم أعارض بالأصل.", "p": 138}, {"q": "عياض في الرواية من فرع لم يُقابَل بالأصل:", "o": ["بشروط", "المنع مطلقًا", "الجواز"], "a": 1, "w": "وأجازها الأسفراييني.", "p": 138}]}];
  var KEY = [[0, 2, 4, 6], [0, 2, 4, 6], [0, 2, 4, 6], [0, 2, 4, 6], [0, 2, 4, 6], [0, 2, 4, 6], [0, 2, 4, 6], [0, 2, 4, 6], [0, 2, 4, 6], [0, 2, 4, 6]];
  var LET = ["أ","ب","ج","د"];
  function AR(n){ try{ return Number(n).toLocaleString("ar-EG"); }catch(e){ return String(n); } }
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(s){ return esc(s).replace(/\*([^*]+)\*/g,'<b class="e">$1</b>'); }
  function $(id){ return document.getElementById(id); }

  var secs = [], cur = -1, total = 0;

  D.forEach(function(sec, si){
    var box = document.createElement("div"); box.hidden = true;
    var recs = [];
    sec.items.forEach(function(it, qi){
      total++;
      var card = document.createElement("div"); card.className = "q c" + (si % 6);
      var num = document.createElement("div"); num.className = "q-num"; num.textContent = "السؤال " + AR(qi + 1) + " من " + AR(sec.items.length) + (it.p ? "  •  📖 الكتاب ص " + AR(it.p) : "");
      var qt = document.createElement("p"); qt.className = "q-text"; qt.textContent = it.q;
      var opts = document.createElement("div"); opts.className = "opts" + (it.tf ? " tf" : "");
      var rec = {q: it, card: card, opts: [], ans: null, first: null, why: null};
      it.o.forEach(function(o, oi){
        var b = document.createElement("button"); b.type = "button"; b.className = "opt";
        if(!it.tf){ var l = document.createElement("span"); l.className = "letter"; l.textContent = LET[oi]; b.appendChild(l); }
        var t = document.createElement("span"); t.className = "txt"; t.textContent = o; b.appendChild(t);
        b.addEventListener("click", function(){ choose(si, rec, oi); });
        opts.appendChild(b); rec.opts.push(b);
      });
      card.appendChild(num); card.appendChild(qt); card.appendChild(opts);
      box.appendChild(card); recs.push(rec);
    });
    $("cards").appendChild(box);
    secs.push({t: sec.t, box: box, recs: recs});

    var tile = document.createElement("button"); tile.type = "button"; tile.className = "tile c" + (si % 6); tile.id = "tile" + si;
    tile.innerHTML = '<b><span>' + esc(sec.t) + '</span><span id="tp' + si + '"></span></b><small>' + AR(sec.items.length) + ' سؤالاً</small><div class="mini"><i id="tb' + si + '"></i></div>';
    tile.addEventListener("click", function(){ openSec(si); });
    $("grid").appendChild(tile);
  });
  $("total").textContent = AR(total) + " سؤالاً في " + AR(D.length) + " قسماً";

  function paint(rec){
    var right = rec.ans === rec.q.a;
    rec.card.classList.add("locked");
    rec.opts.forEach(function(b, i){
      b.classList.remove("ok","no");
      if(i === rec.q.a) b.classList.add("ok");
      if(i === rec.ans && !right) b.classList.add("no");
    });
    if(!rec.why){
      var w = document.createElement("div"); w.className = "why";
      var v = document.createElement("span"); v.className = "verdict " + (right ? "ok" : "no");
      v.textContent = right ? "إجابة صحيحة ✓" : "إجابة خاطئة، والصواب: " + rec.q.o[rec.q.a];
      var p = document.createElement("div"); p.innerHTML = fmt(rec.q.w);
      w.appendChild(v); w.appendChild(p); rec.card.appendChild(w); rec.why = w;
    }
  }
  function unpaint(rec){
    rec.ans = null; rec.card.classList.remove("locked");
    rec.opts.forEach(function(b){ b.classList.remove("ok","no"); });
    if(rec.why){ rec.why.remove(); rec.why = null; }
  }
  function counts(si){
    var ok = 0, no = 0;
    secs[si].recs.forEach(function(r){ if(r.ans === null) return; if(r.ans === r.q.a) ok++; else no++; });
    return {ok: ok, no: no, left: secs[si].recs.length - ok - no, n: secs[si].recs.length};
  }
  function choose(si, rec, oi){
    if(rec.ans !== null) return;
    rec.ans = oi;
    if(rec.first === null) rec.first = (oi === rec.q.a);
    paint(rec); update(si);
    var c = counts(si);
    var pending = secs[si].recs.some(function(r){ return !r.card.hidden && r.ans === null; });
    if(!pending){
      showResult(si, c);
      setTimeout(function(){ $("result").scrollIntoView({behavior: "smooth", block: "center"}); }, 350);
    }
  }
  function showResult(si, c){
    var s = secs[si], firstOk = s.recs.filter(function(r){ return r.first === true; }).length;
    var res = $("result"); res.hidden = false;
    res.className = "result c" + (si % 6);
    if(c.no === 0){
      $("rTitle").textContent = "أحسنت، أتقنت هذا القسم ✓";
      $("rText").textContent = "أجبت صحيحاً من أول مرة عن " + AR(firstOk) + " من " + AR(c.n) + " سؤالاً، وأتقنت الباقي بعد الإعادة.";
    } else {
      $("rTitle").textContent = "انتهى القسم";
      $("rText").textContent = "الصحيح الآن " + AR(c.ok) + " من " + AR(c.n) + ". أخطأت في " + AR(c.no) + (c.no > 10 ? " سؤالاً" : c.no === 1 ? " سؤال" : " أسئلة") + "، أعدها الآن لتثبت.";
    }
    $("retryWrong").hidden = (c.no === 0);
    $("nextSec").hidden = (si >= secs.length - 1);
  }
  function update(si){
    var c = counts(si);
    $("cOk").textContent = AR(c.ok); $("cNo").textContent = AR(c.no); $("cLeft").textContent = AR(c.left);
    $("tOk").style.width = (c.ok / c.n * 100) + "%"; $("tNo").style.width = (c.no / c.n * 100) + "%";
    refreshTile(si);
  }
  function refreshTile(si){
    var c = counts(si);
    $("tp" + si).textContent = c.ok === c.n ? "✓" : (c.ok || c.no ? AR(c.ok) + " / " + AR(c.n) : "");
    $("tb" + si).style.width = (c.ok / c.n * 100) + "%";
  }
  function openSec(si){
    cur = si;
    secs.forEach(function(s, i){ s.box.hidden = (i !== si); });
    $("home").hidden = true; $("secView").hidden = false;
    $("bar").className = "bar c" + (si % 6);
    $("secTitle").textContent = secs[si].t;
    $("result").hidden = true;
    update(si);
    var c = counts(si);
    if(c.left === 0 && c.n > 0) showResult(si, c);
    window.scrollTo(0, 0);
  }
  function goHome(){
    $("secView").hidden = true; $("home").hidden = false; cur = -1;
    window.scrollTo(0, 0);
  }
  $("back").addEventListener("click", goHome);
  $("nextSec").addEventListener("click", function(){ if(cur < secs.length - 1) openSec(cur + 1); });
  $("retryWrong").addEventListener("click", function(){
    var first = null;
    secs[cur].recs.forEach(function(r){
      if(r.ans === r.q.a){ r.card.hidden = true; }
      else { unpaint(r); r.card.hidden = false; if(!first) first = r; }
    });
    $("result").hidden = true; update(cur);
    if(first) first.card.scrollIntoView({behavior: "auto", block: "start"});
  });
  $("restart").addEventListener("click", function(){
    secs[cur].recs.forEach(function(r){ unpaint(r); r.first = null; r.card.hidden = false; });
    $("result").hidden = true; update(cur); window.scrollTo(0, 0);
  });

  /* الملخص */
  function buildSum(all){
    var html = "";
    D.forEach(function(sec, si){
      var ks = all ? sec.items.map(function(_, i){ return i; }) : (KEY[si] || []); if(!ks.length) return;
      html += '<div class="sg c' + (si % 6) + '"><h3>' + esc(sec.t) + '</h3>';
      ks.forEach(function(k){
        var it = sec.items[k]; if(!it) return;
        html += '<div class="sq"><div class="sqq">' + (it.p ? '<span class="sqp">📖 ص ' + AR(it.p) + '</span> ' : '') + esc(it.q) + '</div><div class="sqa">' + esc(it.o[it.a]) + '</div><div class="sqw">' + esc(String(it.w).replace(/\*/g, '')) + '</div></div>';
      });
      html += '</div>';
    });
    $("sumBody").innerHTML = html;
    $("sumTitle").textContent = all ? "ملخص جميع الأسئلة" : "ملخص أهم الأسئلة";
    $("sheet").hidden = false; $("sheet").scrollTop = 0;
  }
  $("sumBtn").addEventListener("click", function(){ buildSum(false); });
  $("sumAllBtn").addEventListener("click", function(){ buildSum(true); });
  $("closeSum").addEventListener("click", function(){ $("sheet").hidden = true; });

  D.forEach(function(s, i){ refreshTile(i); });
})();
</script>
