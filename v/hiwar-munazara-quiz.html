<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار الحوار والمناظرة الشامل</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1fa;--surface:#fff;--ink:#1c2340;--muted:#5d6685;--line:#d5dbef;--chip:#e3e8f7;--ok:#15803d;--ok-bg:#dcf5e5;--no:#be123c;--no-bg:#fde4ea;--focus:#4338ca;--track:#d5dbef;
--c0:#4338ca;--c1:#be185d;--c2:#0e7490;--c3:#b45309;--c4:#6d28d9;--c5:#047857}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0f1326;--surface:#181d38;--ink:#eceffd;--muted:#9aa4cc;--line:#2c345c;--chip:#232a4d;--ok:#6ee7a0;--ok-bg:#0f2e20;--no:#fda4b8;--no-bg:#3a1220;--focus:#a5b4fc;--track:#2c345c;
--c0:#a5b4fc;--c1:#f9a8d4;--c2:#67e8f9;--c3:#fcd34d;--c4:#c4b5fd;--c5:#6ee7b7}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0f1326;--surface:#181d38;--ink:#eceffd;--muted:#9aa4cc;--line:#2c345c;--chip:#232a4d;--ok:#6ee7a0;--ok-bg:#0f2e20;--no:#fda4b8;--no-bg:#3a1220;--focus:#a5b4fc;--track:#2c345c;
--c0:#a5b4fc;--c1:#f9a8d4;--c2:#67e8f9;--c3:#fcd34d;--c4:#c4b5fd;--c5:#6ee7b7}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:18px;line-height:1.8;padding:0 14px 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin-inline:auto;min-width:0}
h1{font-size:26px;line-height:1.4;margin:22px 0 2px;color:var(--c0)}
.lead{margin:0 0 14px;color:var(--muted);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.act{border:2px solid var(--c0);background:var(--c0);color:var(--surface);border-radius:12px;padding:9px 18px;font-weight:700;font-size:16px;min-height:44px}
.act.alt{background:transparent;color:var(--c0)}
.act[hidden]{display:none}
.toprow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.total{color:var(--muted);font-size:15px}
.grid{display:grid;gap:10px;margin-top:12px}
.tile{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-inline-start:8px solid var(--c);border-radius:14px;padding:12px 14px}
.tile b{display:flex;justify-content:space-between;gap:10px;font-size:19px;color:var(--c)}
.tile small{display:block;color:var(--muted);font-size:14px;line-height:1.5}
.mini{height:6px;border-radius:9px;background:var(--track);margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);width:0;transition:width .25s}
.c0{--c:var(--c0)}.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:2px solid var(--c)}
.bar-row{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:15px;min-height:40px;white-space:nowrap}
.sec-title{font-weight:700;color:var(--c);font-size:19px;flex:1;min-width:0}
.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;margin-top:4px}
.s-ok{color:var(--ok)}.s-no{color:var(--no)}.s-left{color:var(--muted)}
.track{height:7px;border-radius:9px;background:var(--track);margin-top:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%;transition:width .25s}
.t-ok{background:var(--ok)}.t-no{background:var(--no)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-block:12px}
.q[hidden]{display:none}
.q-num{font-size:14px;color:var(--c);font-weight:700}
.q-text{margin:0 0 10px;font-size:19px;line-height:1.7;font-weight:600}
.opts{display:grid;gap:8px}
.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:18px;line-height:1.6;min-height:48px}
.letter{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--chip);color:var(--muted);display:grid;place-items:center;font-size:14px;font-weight:700}
.txt{min-width:0;overflow-wrap:anywhere}
.tf .opt{justify-content:center;align-items:center;font-weight:700}
.locked .opt{pointer-events:none}
.locked .opt:not(.ok):not(.no){opacity:.55}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.no{background:var(--no-bg);border-color:var(--no);color:var(--no);font-weight:700}
.opt.ok .letter{background:var(--ok);color:var(--ok-bg)}
.opt.no .letter{background:var(--no);color:var(--no-bg)}
.why{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:16px;font-weight:700}
.why.ok{color:var(--ok)}.why.no{color:var(--no)}
.result{background:var(--surface);border:2px solid var(--c);border-radius:16px;padding:16px;margin-top:18px}
.result h3{margin:0 0 4px;font-size:21px;color:var(--c)}
.result p{margin:4px 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.result .act{background:var(--c);border-color:var(--c);color:var(--surface)}
.result .act.alt{background:transparent;color:var(--c)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(env(safe-area-inset-bottom,0px) + 30px)}
.sheet[hidden]{display:none}
.sheet-in{max-width:720px;margin-inline:auto}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.sheet-head h2{margin:0;font-size:22px;color:var(--c0)}
.sg{background:var(--surface);border:1px solid var(--line);border-inline-start:8px solid var(--c);border-radius:14px;padding:10px 14px;margin-block:12px}
.sg h3{margin:0 0 6px;font-size:19px;color:var(--c)}
.sq{padding:8px 0;border-top:1px dashed var(--line)}
.sq:first-of-type{border-top:0}
.sqq{font-size:16px;color:var(--muted);line-height:1.7}
.sqa{font-size:18px;font-weight:700;color:var(--ok);line-height:1.7}
@media (prefers-reduced-motion:reduce){.mini i,.track i{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <div id="home">
    <h1>اختبار الحوار والمناظرة الشامل</h1>
    <p class="lead">اختر قسماً، أجب عن أسئلته، وفي نهايته أعد الأسئلة التي أخطأت فيها حتى تتقنها.</p>
    <div class="toprow">
      <button class="act" id="impBtn" type="button">أهم الأسئلة</button>
      <button class="act alt" id="sumBtn" type="button">جميع الأسئلة (ملخص)</button>
      <span class="total" id="total"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="secView" hidden>
    <div class="bar" id="bar">
      <div class="bar-row"><button class="back" id="back" type="button">‹ الأقسام</button><div class="sec-title" id="secTitle"></div></div>
      <div class="stats" role="status" aria-live="polite">
        <span class="s-ok">صحيح <b id="cOk">٠</b></span><span class="s-no">خطأ <b id="cNo">٠</b></span><span class="s-left">المتبقي <b id="cLeft">٠</b></span>
      </div>
      <div class="track" aria-hidden="true"><i class="t-ok" id="tOk" style="width:0"></i><i class="t-no" id="tNo" style="width:0"></i></div>
    </div>
    <div id="cards"></div>
    <div class="result" id="result" hidden>
      <h3 id="rTitle"></h3><p id="rText"></p>
      <div class="btns">
        <button class="act" id="retryWrong" type="button">أعد الأسئلة التي أخطأت فيها</button>
        <button class="act" id="nextSec" type="button">القسم التالي ›</button>
        <button class="act alt" id="restart" type="button">ابدأ القسم من جديد</button>
      </div>
    </div>
  </div>
</main>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="ملخص مختصر">
  <div class="sheet-in">
    <div class="sheet-head"><h2>ملخص جميع الأسئلة والأجوبة</h2><button class="act alt" id="closeSum" type="button">إغلاق</button></div>
    <div id="sumBody"></div>
  </div>
</div>
<script>
(function(){
var D=[
["مفهوم الحوار","الدرس ١",[
["المعنى الجامع لمادة (ح و ر) في اللغة:",["الجلوس","الرجوع","الغلبة","السكوت"],1,1],
["«تحاوروا» عند ابن منظور بمعنى:",["تخاصموا","تراجعوا الكلام بينهم","تصالحوا","سكتوا"],1],
["معنى ﴿إنه ظن أن لن يحور﴾ عند القرطبي:",["لن يموت","لن يرجع إلى ربه","لن يتكلم","لن يحاسب"],1],

["المستثنون في الآية عند ابن كثير هم:",["الأغنياء","أهل الاجتماع على الحق","العلماء فقط","الأنبياء فقط"],1],

function paint(rec){
  var right=rec.ans===rec.q.a;rec.card.classList.add("locked");

}

function choose(si,rec,oi){
  if(rec.ans!==null)return;
  rec.ans=oi;if(rec.first===null)rec.first=(oi===rec.q.a);

  else{$("rTitle").textContent="انتهى القسم";$("rText").textContent="الصحيح الآن "+AR(c.ok)+" من "+AR(c.n)+". أخطأت في "+AR(c.no)+(c.no===1?" سؤال":c.no===2?" سؤالين":" أسئلة")+"، أعدها الآن لتثبت."}

}

}

  $("secTitle").textContent=secs[si].t;$("result").hidden=true;update(si);
  var c=counts(si);if(c.left===0)showResult(si,c);window.scrollTo(0,0);
}

  var first=null;

});
