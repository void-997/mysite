*{box-sizing:border-box}

.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}

.hero h1{margin:0;font-size:26px;font-weight:800;line-height:1.4}.hero p{margin:4px 0 0;opacity:.95}
.big{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:18px;padding:14px 18px;margin-bottom:10px;background:var(--ink);color:var(--bg);font-weight:800;min-height:56px;font-size:18px}
.big.alt{background:var(--card);color:var(--ink);border:2px solid var(--no)}.big[disabled]{opacity:.45;cursor:default}
h2.sub{font-size:18px;margin:20px 4px 8px;color:var(--mute)}
.card{background:var(--card);border-radius:20px;border:2px solid var(--c);margin-bottom:12px;overflow:hidden}
.card .h{background:var(--c);color:#fff;padding:10px 16px;font-weight:800;display:flex;justify-content:space-between;gap:8px}
.card .b{padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{border:2px solid var(--c);background:transparent;border-radius:999px;padding:6px 18px;font-weight:700;min-height:44px}
.pill.fill{background:var(--c);color:#fff}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .back{border:2px solid var(--line);background:var(--card);border-radius:12px;min-width:44px;min-height:44px;font-weight:800}
.bar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-weight:600;font-size:15px;margin:0 4px 8px}
.q{background:var(--card);border-radius:22px;padding:20px 18px;border:2px solid var(--line)}
.qt{font-size:20px;font-weight:800;margin-bottom:14px;unicode-bidi:plaintext;text-align:start}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:start;unicode-bidi:plaintext;border:2px solid var(--line);background:transparent;border-radius:14px;padding:12px 14px;min-height:52px;font-weight:600}
.opt:hover{border-color:var(--c)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--no);border-color:var(--no);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:14px;padding:10px 14px}.fb.g{background:var(--okbg)}.fb.b{background:var(--nobg)}
.next{margin-top:14px;background:var(--c);color:#fff;border:0;border-radius:14px;width:100%;min-height:52px;font-weight:800;font-size:18px}
.score{text-align:center}.score .n{font-size:64px;font-weight:800;line-height:1.1;color:var(--c)}
.rv{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:8px 0}
.rv .a{color:var(--ok);font-weight:700}.rv .y{color:var(--no);font-weight:700}
.rv .t{unicode-bidi:plaintext;text-align:start;font-weight:700}
.st table{width:100%;border-collapse:collapse;margin:8px 0;background:var(--card);border-radius:12px;overflow:hidden}
.st-w{overflow-x:auto}
.st td,.st th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:start;unicode-bidi:plaintext}
.st th{background:var(--c);color:#fff}
.tip{background:var(--card);border:2px solid var(--c);border-radius:14px;padding:8px 12px;margin:8px 0}
.en{direction:ltr;text-align:left;font-weight:700}
@keyframes pop{0%{transform:scale(.97);opacity:.6}100%{transform:scale(1);opacity:1}}
.q{animation:pop .25s}@media (prefers-reduced-motion:reduce){.q{animation:none}.bar i{transition:none}}
</style>
